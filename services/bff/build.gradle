// Backend for frontend: the only entry point for the customer and staff portals (LLD section 2). Each domain's routes
// live in its module under domains/<domain>/bff; this app adds login, the home screen, live push and the staff queue.
dependencies {
    implementation project(':libs:bff-core')
    implementation project(':domains:onboarding-bff')
    implementation project(':domains:payments-bff')
    implementation project(':domains:cards-bff')
    implementation project(':domains:creditcards-bff')
    implementation project(':domains:compliance-bff')
    implementation project(':domains:recon-bff')

    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    // Domain boundaries (DomainBoundariesTest).
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}
