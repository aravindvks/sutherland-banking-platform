{{- if and .Values.connect.enabled .Values.connect.registerOutbox }}
# Registers (or updates) the Debezium outbox connector after every install or upgrade (LLD section 9), with the same
# settings as infra/compose/register-outbox-connector.sh locally. PUT is idempotent, so re-running it is safe.
# The database user needs the REPLICATION privilege and the database wal_level=logical (runbooks).
apiVersion: batch/v1
kind: Job
metadata:
  name: register-outbox-connector
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: register-outbox-connector
    app.kubernetes.io/part-of: pbp
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: register-outbox-connector
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: {{ .Values.connect.registerImage }}
          env:
            - name: DB_HOST
              value: {{ .Values.config.DB_HOST | quote }}
            - name: DB_NAME
              value: {{ .Values.config.DB_NAME | default "pbp" | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: DB_PASSWORD
            - name: TABLES
              value: {{ .Values.connect.outboxTables | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              URL=http://connect:8083
              for i in $(seq 1 150); do curl -sf "$URL/connectors" >/dev/null && break; sleep 2; done
              cat > /tmp/outbox.json <<JSON
              {
                "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
                "plugin.name": "pgoutput",
                "database.hostname": "$DB_HOST",
                "database.port": "5432",
                "database.user": "$DB_USER",
                "database.password": "$DB_PASSWORD",
                "database.dbname": "$DB_NAME",
                "database.sslmode": "require",
                "topic.prefix": "pbp",
                "slot.name": "pbp_outbox",
                "publication.name": "pbp_outbox",
                "publication.autocreate.mode": "all_tables",
                "table.include.list": "$TABLES",
                "snapshot.mode": "no_data",
                "tombstones.on.delete": "false",
                "key.converter": "org.apache.kafka.connect.storage.StringConverter",
                "value.converter": "org.apache.kafka.connect.storage.StringConverter",
                "header.converter": "org.apache.kafka.connect.storage.StringConverter",
                "transforms": "outbox",
                "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
                "transforms.outbox.table.field.event.id": "event_id",
                "transforms.outbox.table.field.event.key": "aggregate_id",
                "transforms.outbox.table.field.event.payload": "payload",
                "transforms.outbox.route.by.field": "topic",
                "transforms.outbox.route.topic.replacement": "\${routedByValue}",
                "transforms.outbox.table.fields.additional.placement": "event_type:header:type,correlation_id:header:correlationId,event_id:header:eventId,traceparent:header:traceparent,created_at:header:occurredAt",
                "transforms.outbox.table.expand.json.payload": "false"
              }
              JSON
              curl -sf -X PUT "$URL/connectors/pbp-outbox/config" -H 'Content-Type: application/json' --data @/tmp/outbox.json
              for i in $(seq 1 60); do
                s=$(curl -sf "$URL/connectors/pbp-outbox/status" || true)
                echo "$s" | grep -q '"state":"RUNNING"' && ! echo "$s" | grep -q '"state":"FAILED"' && { echo "pbp-outbox RUNNING"; exit 0; }
                sleep 5
              done
              echo "pbp-outbox not RUNNING: $s"; exit 1
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
{{- end }}
