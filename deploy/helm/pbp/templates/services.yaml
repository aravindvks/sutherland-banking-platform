{{- /* One Deployment, Service, HPA and PDB per enabled service (LLD section 13). */ -}}
{{- /* A service that belongs to a module is deployed only when that module is switched on (values: modules). */ -}}
{{- $moduleOf := dict "credit-adapter" "creditcards" "recon-service" "recon" }}
{{- range $name, $s := .Values.services }}
{{- $module := get $moduleOf $name }}
{{- if and (ne (toString $s.enabled) "false") (or (not $module) (has $module $.Values.modules)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: pbp
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  replicas: {{ $s.min }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: pbp
    spec:
      {{- with $.Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ if $s.spreadRequired }}DoNotSchedule{{ else }}ScheduleAnyway{{ end }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $s.port }}
          envFrom:
            - configMapRef:
                name: pbp-config
            - secretRef:
                name: {{ $.Values.secretName }}
                optional: true
          env:
            - name: PORT
              value: {{ $s.port | quote }}
          resources:
            requests:
              cpu: {{ $s.cpu | quote }}
              memory: {{ $s.memory | quote }}
            limits:
              memory: {{ $s.memory | quote }}
          {{- $probe := default "/actuator/health/readiness" $s.probePath }}
          readinessProbe:
            httpGet:
              path: {{ $probe }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ if $s.probePath }}{{ $s.probePath }}{{ else }}/actuator/health/liveness{{ end }}
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
  {{- if and (eq $name "web") (include "pbp.webLoadBalancer" $) }}
  annotations:
    {{- include "pbp.webLbAnnotations" $ | trim | nindent 4 }}
  {{- end }}
spec:
  type: {{ if and (eq $name "web") (include "pbp.webLoadBalancer" $) }}LoadBalancer{{ else }}ClusterIP{{ end }}
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $s.port }}
      targetPort: http
{{- if gt (int $s.max) (int $s.min) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $s.min }}
  maxReplicas: {{ $s.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ default 70 $s.scaleCpu }}
{{- end }}
{{- if gt (int $s.min) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- end }}
{{- end }}
