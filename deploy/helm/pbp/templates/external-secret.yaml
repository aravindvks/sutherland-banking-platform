{{- if .Values.externalSecrets.enabled }}
# Syncs the service Secret with the External Secrets Operator from OCI Vault, AWS Secrets Manager, Azure
# Key Vault or GCP Secret Manager (the ClusterSecretStore named in values; each cloud's Terraform creates these secret names).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStore }}
  target:
    name: {{ .Values.secretName }}
  data:
    {{- range $key := concat (list "DB_USER" "DB_PASSWORD" "WEBHOOK_SECRET" "SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG") .Values.externalSecrets.extraKeys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ printf "pbp-%s-%s" $.Values.env ($key | lower | replace "_" "-") }}
    {{- end }}
{{- end }}
