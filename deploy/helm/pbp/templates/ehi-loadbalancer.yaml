{{- if and .Values.ehiLoadBalancer.enabled (or (has "cards" .Values.modules) (has "creditcards" .Values.modules)) }}
# Dedicated public listener for Thredd's EHI calls (HLD: separate path, not API Gateway).
# OCI and AWS: TLS terminates at this load balancer and only Thredd's ranges may connect (WAF attached by
# Terraform on OCI). Azure: internal, behind the Application Gateway's TLS listener and WAF (infra/terraform/azure).
apiVersion: v1
kind: Service
metadata:
  name: ehi-public
  labels:
    app.kubernetes.io/name: ehi-responder
  annotations:
    {{- include "pbp.ehiLbAnnotations" . | trim | nindent 4 }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  {{- if ne .Values.cloud "azure" }}
  {{- with .Values.ehiLoadBalancer.sourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    app.kubernetes.io/name: ehi-responder
  ports:
    - name: https
      port: {{ if eq .Values.cloud "azure" }}80{{ else }}443{{ end }}
      targetPort: http
{{- end }}
