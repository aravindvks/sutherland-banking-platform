name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --continue 2>&1 | tee build.log

      # Surface compiler errors, failed tests and Gradle's failure summary as annotations,
      # so they are readable from the checks API without downloading logs.
      - name: Report build errors
        if: failure()
        run: |
          {
            grep -E "error:|warning: \[|FAILED|What went wrong|^> |Caused by|Exception" build.log | head -120
          } > summary.txt || true
          msg=$(sed -e 's/%/%25/g' summary.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle build failed::${msg}"
          for f in $(find . -path '*/build/test-results/test/*.xml' 2>/dev/null); do
            if grep -q '<failure' "$f"; then
              detail=$(grep -A3 '<failure' "$f" | head -8 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=Test failure $(basename "$f")::${detail}"
            fi
          done

      - name: Build the web app
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      - name: Validate Docker Compose file
        run: docker compose -f infra/compose/docker-compose.yml --profile apps config --quiet

  # Infrastructure as code: Terraform for OCI and the Helm chart for OKE, validated without a cloud account.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format and validate (OCI, AWS, Azure)
        run: |
          set -o pipefail
          for cloud in oci aws azure; do
            echo "== $cloud" | tee -a infra/terraform/tf.log
            ( cd infra/terraform/$cloud
              terraform fmt -check -recursive -diff >> ../tf.log 2>&1 || echo "terraform fmt ($cloud): style differences (not blocking)"
              terraform init -backend=false -input=false -no-color 2>&1 | tail -3 | tee -a ../tf.log
              terraform validate -no-color 2>&1 | tee -a ../tf.log ) || exit 1
          done
      - name: Helm lint and render
        run: |
          set -o pipefail
          helm lint deploy/helm/pbp 2>&1 | tee helm.log
          helm template pbp-dev deploy/helm/pbp > rendered.yaml
          helm template pbp-demo deploy/helm/pbp -f deploy/helm/pbp/values-demo.yaml > rendered-demo.yaml
          # Observability on: alert rules and dashboards packaged as the deploy workflow does (LLD section 15).
          mkdir -p deploy/helm/pbp/files && cp -r infra/observability deploy/helm/pbp/files/
          helm template pbp-obs deploy/helm/pbp --set observability.enabled=true > rendered-obs.yaml
          # Same chart on AWS and Azure: only values-<cloud>.yaml differs.
          helm template pbp-aws deploy/helm/pbp -f deploy/helm/pbp/values-aws.yaml > rendered-aws.yaml
          helm template pbp-azure deploy/helm/pbp -f deploy/helm/pbp/values-azure.yaml > rendered-azure.yaml
          # Module switches: the five banks CI tests. credit-adapter only with creditcards, recon-service only with recon,
          # thredd-adapter, ehi-responder and the EHI load balancer only with a card module (cards or creditcards).
          for set in onboarding,payments,compliance,cards,creditcards,recon onboarding,payments,compliance,cards,recon \
                     onboarding,payments,compliance,recon onboarding,payments,compliance,cards,creditcards \
                     onboarding,payments,compliance; do
            out="rendered-modules-$(echo "$set" | tr ',' '-').yaml"
            helm template pbp-mods deploy/helm/pbp --set "modules={$set}" > "$out"
            for pair in credit-adapter:creditcards recon-service:recon; do
              svc=${pair%%:*}; mod=${pair##*:}
              if echo ",$set," | grep -q ",$mod,"; then want=1; else want=0; fi
              if grep -q "name: $svc\$" "$out"; then got=1; else got=0; fi
              [ "$want" = "$got" ] || { echo "Modules $set: $svc rendered=$got, expected $want"; exit 1; }
            done
            if echo ",$set," | grep -qE ",(cards|creditcards),"; then want=1; else want=0; fi
            for svc in thredd-adapter ehi-responder ehi-public; do
              if grep -q "name: $svc\$" "$out"; then got=1; else got=0; fi
              [ "$want" = "$got" ] || { echo "Modules $set: $svc rendered=$got, expected $want"; exit 1; }
            done
            echo "Modules $set: chart renders the right services"
          done
          grep -q "aws-load-balancer-type: external" rendered-aws.yaml && grep -q "kind: Ingress" rendered-aws.yaml \
            && grep -q "name: kafka-topics" rendered-aws.yaml
          grep -q "azure-load-balancer-internal" rendered-azure.yaml && ! grep -q "oci-load-balancer" rendered-azure.yaml
          grep -q "kind: PrometheusRule" rendered-obs.yaml && grep -q "dashboard-pbp-payments" rendered-obs.yaml
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas rendered.yaml rendered-demo.yaml rendered-obs.yaml rendered-aws.yaml rendered-azure.yaml rendered-modules-*.yaml 2>&1 | tee -a helm.log
      - name: Check alert rules and collector config
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/infra/observability:/o:ro" --entrypoint promtool prom/prometheus:v2.54.1 \
            check rules /o/prometheus/alerts.yml 2>&1 | tee -a helm.log
          docker run --rm -v "$PWD/infra/observability:/o:ro" otel/opentelemetry-collector-contrib:0.111.0 \
            validate --config=/o/otel-collector.yaml 2>&1 | tee -a helm.log
      - name: Report infrastructure errors
        if: failure()
        run: |
          msg=$(cat infra/terraform/tf.log helm.log 2>/dev/null | grep -v '^\s*$' | tail -60 | sed -e 's/%/%25/g' | cut -c1-300 | awk '{printf "%s%%0A", $0}')
          echo "::error title=Infrastructure validation failed::${msg}"

  # Starts the full stack in Docker and runs scripts/smoke.sh: mapping links, a card tap through
  # the EHI responder, and a same-bank payment through BFF → Kafka → Temporal → Essence adapter.
  # Five banks from the same code (module switches, phase A). Each bank builds only its modules, and its smoke test
  # runs the domains of those modules and checks that every module left out has no routes or workflows.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: bank-1-everything
            modules: onboarding,payments,compliance,cards,creditcards,recon
          - set: bank-2-no-credit-cards
            modules: onboarding,payments,compliance,cards,recon
          - set: bank-3-corporate
            modules: onboarding,payments,compliance,recon
          - set: bank-4-no-reconciliation
            modules: onboarding,payments,compliance,cards,creditcards
          - set: bank-5-core-only
            modules: onboarding,payments,compliance
    name: e2e (${{ matrix.set }})
    env:
      PBP_MODULES: ${{ matrix.modules }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Start the stack
        run: |
          ./gradlew bootJar --no-daemon
          docker compose -f infra/compose/docker-compose.yml --profile apps up -d --build

      - name: Wait for services
        run: |
          for port in 8090 8082 8084 8085 8086 8089 8083 8080 8081 8087; do
            for i in $(seq 1 90); do
              curl -sf "http://localhost:$port/actuator/health" >/dev/null && { echo "port $port up"; break; }
              sleep 2
            done
            curl -sf "http://localhost:$port/actuator/health" >/dev/null || { echo "port $port did not start"; exit 1; }
          done

      - name: Wait for Keycloak
        run: for i in $(seq 1 90); do curl -sf http://localhost:8180/realms/pbp >/dev/null && exit 0; sleep 2; done; exit 1

      - name: Wait for the web app
        run: for i in $(seq 1 60); do curl -sf http://localhost:3000/ >/dev/null && exit 0; sleep 2; done; exit 1

      - name: Smoke test
        shell: bash
        run: |
          # pipefail: without it the step takes tee's exit code and a failed check still passes.
          set -o pipefail
          ./scripts/smoke.sh 2>&1 | tee smoke.log

      # Every domain must prove itself alone (phase A, "every domain proves itself alone"): run each on its own,
      # setting up only what it needs through the fixtures in scripts/smoke/lib.sh.
      - name: Smoke test, each domain alone
        if: matrix.set == 'bank-1-everything'
        shell: bash
        run: |
          set -o pipefail
          for d in onboarding payments cards compliance recon credit platform observability; do
            echo "==== $d alone ====" | tee -a smoke.log
            ./scripts/smoke.sh "$d" 2>&1 | tee -a smoke.log
          done

      - name: Observability stack status
        if: always()
        run: |
          docker compose -f infra/compose/docker-compose.yml ps -a otel-collector tempo prometheus loki promtail grafana kafka-exporter || true
          for s in tempo loki otel-collector promtail; do
            echo "---- $s ----"; docker compose -f infra/compose/docker-compose.yml logs --no-color --tail 25 $s 2>&1 || true
          done
          curl -s -o /dev/null -w 'tempo /ready %{http_code}\n' http://localhost:3200/ready || true
          curl -s -o /dev/null -w 'loki /ready %{http_code}\n' http://localhost:3100/ready || true

      - name: Report failed checks
        if: failure()
        run: |
          { grep -E 'FAIL' smoke.log || echo "Stopped after: $(grep -E '^[0-9]+\.' smoke.log | tail -1)"; } \
            | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-900 | sed 's/^/::error title=Smoke test::/' || true

      - name: Report stack errors
        if: failure()
        run: |
          docker compose -f infra/compose/docker-compose.yml --profile apps ps -a > ps.txt 2>&1 || true
          docker compose -f infra/compose/docker-compose.yml --profile apps logs --no-color > stack.log 2>&1 || true
          {
            cat ps.txt
            echo "---- smoke ----"; cat smoke.log 2>/dev/null || echo "(the smoke test did not run)"
            echo "---- errors ----"
            grep -E "ERROR|Exception|Caused by|FAIL|refused|denied" stack.log | grep -v "WARN" | head -80
          } > summary.txt
          # Service errors first, one annotation each, so they are not cut off by the long summary.
          grep -E "Exception|Caused by| ERROR " stack.log | grep -v WARN | sed 's/\x1b\[[0-9;]*m//g' | awk '!seen[$0]++' \
            | head -8 | cut -c1-700 | sed 's/^/::error title=Service error::/' || true
          # A service that never became healthy: show the end of its log in the step output.
          for s in $(docker compose -f infra/compose/docker-compose.yml --profile apps ps -a --format '{{.Service}} {{.Status}}' 2>/dev/null | grep -viE ' Up .*healthy|Up [0-9]+ (seconds|minutes|hours)$' | awk '{print $1}'); do
            echo "---- $s (last 60 lines) ----"; docker compose -f infra/compose/docker-compose.yml --profile apps logs --no-color --tail 60 "$s" 2>&1 || true
          done
          msg=$(sed -e 's/%/%25/g' summary.txt | cut -c1-400 | awk '{printf "%s%%0A", $0}')
          echo "::error title=End-to-end failed::${msg}"
