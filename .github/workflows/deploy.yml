name: deploy

# Builds every image, pushes it to OCIR and rolls the release out to OKE with Helm.
# Needs repository secrets: OCIR_REGISTRY (terraform output "registry"), OCIR_USERNAME
# (<namespace>/<user>), OCIR_TOKEN (auth token) and KUBECONFIG_B64 (base64 kubeconfig for the cluster).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: dev, test or demo
        required: true
        default: dev
      modules:
        description: Modules this bank runs (onboarding, payments and compliance are always on)
        required: true
        default: onboarding,payments,compliance,cards,creditcards,recon

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TAG: ${{ github.sha }}
      REGISTRY: ${{ secrets.OCIR_REGISTRY }}
      # Module switches: the jars are built with these modules only, and Helm deploys the same list.
      PBP_MODULES: ${{ inputs.modules }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Log in to OCIR
        run: echo "${{ secrets.OCIR_TOKEN }}" | docker login "${REGISTRY%%/*}" -u "${{ secrets.OCIR_USERNAME }}" --password-stdin

      - name: Build and push images
        run: |
          for m in services/bff services/orchestrator services/mapping-service services/ehi-responder \
                   services/essence-adapter services/thredd-adapter services/atfinity-adapter \
                   services/credit-adapter services/recon-service simulators/vendor-simulator; do
            name=$(basename "$m")
            docker build -f infra/compose/Dockerfile --build-arg MODULE="$m" --build-arg JAR="$name.jar" \
              -t "$REGISTRY/$name:$TAG" .
            docker push "$REGISTRY/$name:$TAG"
          done
          docker build -t "$REGISTRY/web:$TAG" --build-arg VITE_KEYCLOAK_URL="${{ vars.IDENTITY_URL }}" --build-arg VITE_GRAFANA_URL="${{ vars.GRAFANA_URL }}" web
          docker push "$REGISTRY/web:$TAG"

      - name: Deploy with Helm
        run: |
          # Alert rules and dashboards ship with the chart (templates/observability.yaml).
          mkdir -p deploy/helm/pbp/files && cp -r infra/observability deploy/helm/pbp/files/
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          extra=""
          [ -f "deploy/helm/pbp/values-${{ inputs.environment }}.yaml" ] && extra="-f deploy/helm/pbp/values-${{ inputs.environment }}.yaml"
          helm upgrade --install "pbp-${{ inputs.environment }}" deploy/helm/pbp $extra \
            --namespace "pbp-${{ inputs.environment }}" --create-namespace \
            --set image.registry="$REGISTRY" --set image.tag="$TAG" --set env="${{ inputs.environment }}" \
            --set "modules={$PBP_MODULES}" \
            --wait --timeout 15m
