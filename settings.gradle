plugins {
    // Downloads a Java 21 toolchain if the machine has a different JDK.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'sutherland-banking-platform'

include 'libs:platform-common'
include 'libs:orchestration-core'

// Business domains, one folder each (domains/<domain>/...). Each part of a domain is its own module with a
// unique name, so the jars never clash inside an application that assembles several of them.
['onboarding', 'payments', 'cards', 'creditcards', 'compliance'].each { d ->
    include "domains:${d}-orchestration"
    project(":domains:${d}-orchestration").projectDir = file("domains/${d}/orchestration")
}

include 'services:bff'
include 'services:orchestrator'
include 'services:mapping-service'
include 'services:ehi-responder'
include 'services:essence-adapter'
include 'services:thredd-adapter'
include 'services:atfinity-adapter'
include 'services:recon-service'
include 'services:credit-adapter'

include 'simulators:vendor-simulator'
