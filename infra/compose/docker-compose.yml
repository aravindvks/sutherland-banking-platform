# Sutherland Banking Platform — local stack.
#   Infrastructure only:   docker compose -f infra/compose/docker-compose.yml up -d
#   Everything:            make up   (builds the jars first, then starts the "apps" profile)
name: sbp   # "pbp" is the frozen prototype repo; a different name keeps containers and volumes apart

services:
  postgres:
    image: postgres:16-alpine
    # Logical decoding for Debezium (outbox relay). max_connections: 5 services x 10 pooled connections,
    # Temporal (4 roles x 2 stores, capped below), Debezium and headroom; the default 100 ran out.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: pbp
      POSTGRES_USER: pbp
      POSTGRES_PASSWORD: pbp
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pbp -d pbp"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Creates the 9 topics and their dead-letter topics (LLD section 9), then exits.
  kafka-topics:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ./create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092

  # Kafka Connect with Debezium: relays every service's outbox table to its Kafka topic.
  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: pbp-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports: ["8088:8083"]

  outbox-connector:
    image: quay.io/debezium/connect:2.7.3.Final
    depends_on:
      connect: { condition: service_started }
      kafka-topics: { condition: service_completed_successfully }
    volumes:
      - ./register-outbox-connector.sh:/register.sh:ro
    entrypoint: ["/bin/bash", "/register.sh"]

  # Login: Keycloak stands in for OCI Identity Domains locally (realm pbp, demo users in the README).
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak/pbp-realm.json:/opt/keycloak/data/import/pbp-realm.json:ro
    ports: ["8180:8080"]

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  temporal:
    image: temporalio/auto-setup:1.25.1
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      # Cap Temporal's pools (default 20 per store per role) so it cannot exhaust PostgreSQL.
      SQL_MAX_CONNS: "10"
      SQL_MAX_IDLE_CONNS: "5"
      DB_PORT: 5432
      POSTGRES_USER: pbp
      POSTGRES_PWD: pbp
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: pbp-local
      PROMETHEUS_ENDPOINT: 0.0.0.0:8000
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]

  # ---------- Observability (LLD section 15): Grafana on http://localhost:3001 ----------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on: [tempo]
    ports: ["4317:4317", "4318:4318"]

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo.yaml:ro
    ports: ["3200:3200"]

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      # POST /-/reload picks up a changed prometheus.yml or alerts.yml (make up and the smoke test do this).
      - --web.enable-lifecycle
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]

  promtail:
    image: grafana/promtail:3.2.0
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ../observability/promtail.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: on-failure

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pbp-overview.json
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, tempo, loki]
    ports: ["3001:3000"]

  # ---------- Application services (profile "apps") ----------
  vendor-simulator:
    profiles: ["apps"]
    build: &app-build
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args: { MODULE: simulators/vendor-simulator, JAR: vendor-simulator.jar }
    environment:
      SIM_ESSENCE_WEBHOOK_URL: http://essence-adapter:8084/hooks/finastra
      SIM_ATFINITY_WEBHOOK_URL: http://atfinity-adapter:8086/hooks/atfinity
      SIM_THREDD_EHI_URL: http://ehi-responder:8083/ehi/v1/messages
      # Simulated Essence accounts survive restarts; make clean deletes them with the database.
      SIM_STATE_FILE: /data/essence-state.json
      SIM_THREDD_STATE_FILE: /data/thredd-credit-state.json
      SIM_THREDD_WEBHOOK_URL: http://thredd-adapter:8085/hooks/thredd
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes: ["simdata:/data"]
    ports: ["8090:8090"]

  mapping-service:
    profiles: ["apps"]
    build:
      <<: *app-build
      args: { MODULE: services/mapping-service, JAR: mapping-service.jar }
    environment: &app-env
      DB_HOST: postgres
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      KAFKA_BOOTSTRAP: kafka:29092
      TEMPORAL_TARGET: temporal:7233
      ESSENCE_BASE_URL: http://vendor-simulator:8090/essence/v1
      THREDD_BASE_URL: http://vendor-simulator:8090/thredd/v1
      ATFINITY_BASE_URL: http://vendor-simulator:8090/atfinity/v1
      ESSENCE_ADAPTER_URL: http://essence-adapter:8084
      MAPPING_URL: http://mapping-service:8082
      ATFINITY_ADAPTER_URL: http://atfinity-adapter:8086
      THREDD_ADAPTER_URL: http://thredd-adapter:8085
      ORCHESTRATOR_URL: http://orchestrator:8081
      REDIS_HOST: redis
      EVENTS_MODE: outbox
      AUTH_ENABLED: "true"
      KEYCLOAK_JWKS: http://keycloak:8080/realms/pbp/protocol/openid-connect/certs
      EHI_URL: http://ehi-responder:8083
      RECON_URL: http://recon-service:8087
      CREDIT_ADAPTER_URL: http://credit-adapter:8089
      CREDIT_BASE_URL: http://vendor-simulator:8090/credit/v1
      # Local demos: Direct Debits due today are decided at once rather than at 06:00 UK time.
      DD_ENTRY_TIME: "00:00"
      # Traces to the collector (LLD section 15); every request sampled locally.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PBP_ENV: local
    depends_on: &app-deps
      postgres: { condition: service_healthy }
      kafka-topics: { condition: service_completed_successfully }
      outbox-connector: { condition: service_completed_successfully }
    ports: ["8082:8082"]

  essence-adapter:
    profiles: ["apps"]
    build:
      <<: *app-build
      args: { MODULE: services/essence-adapter, JAR: essence-adapter.jar }
    environment: *app-env
    depends_on:
      vendor-simulator: { condition: service_started }
      kafka-topics: { condition: service_completed_successfully }
    ports: ["8084:8084"]

  thredd-adapter:
    profiles: ["apps"]
    build:
      <<: *app-build
      args: { MODULE: services/thredd-adapter, JAR: thredd-adapter.jar }
    environment: *app-env
    depends_on:
      vendor-simulator: { condition: service_started }
      kafka-topics: { condition: service_completed_successfully }
    ports: ["8085:8085"]

  atfinity-adapter:
    profiles: ["apps"]
    build:
      <<: *app-build
      args: { MODULE: services/atfinity-adapter, JAR: atfinity-adapter.jar }
    environment: *app-env
    depends_on:
      vendor-simulator: { condition: service_started }
      kafka-topics: { condition: service_completed_successfully }
    ports: ["8086:8086"]

  credit-adapter:
    profiles: ["apps"]
    build:
      <<: *app-build
      args: { MODULE: services/credit-adapter, JAR: credit-adapter.jar }
    environment: *app-env
    depends_on:
      vendor-simulator: { condition: service_started }
    ports: ["8089:8089"]

  bff:
    profiles: ["apps"]
    build:
      <<: *app-build
      args: { MODULE: services/bff, JAR: bff.jar }
    environment: *app-env
    depends_on: *app-deps
    ports: ["8080:8080"]

  orchestrator:
    profiles: ["apps"]
    build:
      <<: *app-build
      args: { MODULE: services/orchestrator, JAR: orchestrator.jar }
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      kafka-topics: { condition: service_completed_successfully }
      outbox-connector: { condition: service_completed_successfully }
      temporal: { condition: service_started }
    restart: on-failure
    ports: ["8081:8081"]

  ehi-responder:
    profiles: ["apps"]
    build:
      <<: *app-build
      args: { MODULE: services/ehi-responder, JAR: ehi-responder.jar }
    environment: *app-env
    depends_on: *app-deps
    ports: ["8083:8083"]

  recon-service:
    profiles: ["apps"]
    build:
      <<: *app-build
      args: { MODULE: services/recon-service, JAR: recon-service.jar }
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8087:8087"]

  # Customer web app (React). nginx serves it and routes /v1 to the BFF and /sim to the simulator.
  web:
    profiles: ["apps"]
    build:
      context: ../../web
      args:
        VITE_KEYCLOAK_URL: http://localhost:8180
        VITE_GRAFANA_URL: http://localhost:3001
    depends_on: [bff, vendor-simulator]
    ports: ["3000:80"]

volumes:
  pgdata:
  simdata:
