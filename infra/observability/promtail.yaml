# Ships every compose container's stdout to Loki, labelled by compose service (LLD section 15).
server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: compose
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=sbp"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      # Service log lines: "INFO [bff,trace=<id>,span=<id>,cid=<correlation id>] ..."
      - regex:
          expression: '(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)\s+\[[^,\]]*,trace=(?P<trace>[0-9a-f]*),span=[0-9a-f]*,cid=(?P<cid>[^\]]*)\]'
      - labels:
          level:
